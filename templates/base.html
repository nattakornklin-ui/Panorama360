<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>{% block title %}Panorama 360{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">360</span><span>Panorama<span class="brand-light">Studio</span></span></a>
    <nav><a href="{{ url_for('index') }}">หน้าหลัก</a><a href="#how">วิธีใช้งาน</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Panorama Studio <span>สร้างประสบการณ์มุมมองใหม่ในทุกภาพ</span></footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
